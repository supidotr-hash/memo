<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supido — Менеджер сниппетов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <video id="bgVdo" autoplay muted loop playsinline src="https://cdn.gameograf.com/wp-30261-1762426761.mp4"></video>
    <div class="overlay"></div>

    <!-- Экран авторизации -->
    <div id="login-screen" class="login-wrapper" style="display: none;">
        <div class="login-card">
            <div class="logo-supido">Supido</div>
            <input type="password" id="password-input" class="edit-input" placeholder="Введите пароль" onkeydown="if(event.key === 'Enter') submitLogin()">
            <button class="btn-save" style="width: 100%; padding: 10px; font-size: 14px; cursor: pointer;" onclick="submitLogin()">Войти</button>
            <div id="login-error" class="login-error"></div>
        </div>
    </div>

    <!-- Основное приложение -->
    <div class="app-container" id="app-container" style="display: none;">
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="logo-supido">Supido</div>
                <div class="sidebar-header">
                    <h2>Категории</h2>
                    <button class="btn-icon" onclick="startAddCategory()">+ Добавить</button>
                </div>
                
                <!-- Выпадающий блок категорий (мобильный селект) -->
                <div class="mobile-cat-header" onclick="toggleMobileCategories()">
                    <span id="mobile-selected-category">Выберите категорию</span>
                    <i data-lucide="chevron-down" class="icon" id="mobile-chevron"></i>
                </div>

                <!-- Мобильные кнопки сверху (видны, когда категория выбрана, скрываются при открытии списка) -->
                <div class="mobile-top-buttons">
                    <button class="btn-icon" onclick="exportData()" title="Экспорт">Экспорт</button>
                    <button class="btn-icon" onclick="triggerImport()" title="Импорт">Импорт</button>
                    <button class="btn-icon" onclick="logout()" title="Выход">Выход</button>
                    <button class="btn-icon" onclick="toggleHideInterface()" title="Скрыть"><i data-lucide="eye-off" class="icon"></i></button>
                </div>

                <div class="categories-list" id="categories-list"></div>
            </div>
            
            <!-- Десктопный блок кнопок снизу сайдбара -->
            <div class="sidebar-bottom desktop-bottom">
                <button class="btn-icon" onclick="exportData()" title="Экспорт">Экспорт</button>
                <button class="btn-icon" onclick="triggerImport()" title="Импорт">Импорт</button>
                <button class="btn-icon" onclick="logout()" title="Выход">Выход</button>
                <button class="btn-icon" onclick="toggleHideInterface()" title="Скрыть"><i data-lucide="eye-off" class="icon"></i></button>
                <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importData(event)">
            </div>
        </aside>

        <main class="main-content">
            <div class="content-header">
                <h1 id="category-title">Выберите категорию</h1>
                <button class="btn-icon" id="add-block-btn" onclick="startAddBlock()" style="display: none;">+ Добавить блок</button>
            </div>

            <div class="blocks-grid" id="blocks-grid"></div>
        </main>
    </div>

    <div id="toast">Скопировано!</div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js"></script>
</body>
</html>
